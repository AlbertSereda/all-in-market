replicaCount: 0

image:
  repository: "bitnami/kibana"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

env:
  ELASTICSEARCH_HOSTS: "http://elk-elasticsearch:9200"

service:
  port: 5601
  targetPort: 5601
  nodePort: 30561
  type: NodePort

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

volumeMounts: []

volumes: []

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: kibana.example.com
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kibana
              port: 5601
  tls: []