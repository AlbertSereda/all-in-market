apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              in_cluster: true
        ignore_older: 0
        scan_frequency: 10s
        tail_files: true
        symlinks: true

    output.elasticsearch:
      hosts: ["http://elasticsearch:9200"]