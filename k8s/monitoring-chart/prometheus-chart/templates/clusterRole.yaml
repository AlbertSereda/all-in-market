{{- if .Values.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "prometheus.clusterRoleName" . }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
{{- with .Values.clusterRole.rules }}
rules:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
